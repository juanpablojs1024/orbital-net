syntax = "proto3";

package common;
option go_package = "orbital-net/pkg/proto/common";

message Node {
  string id = 1;
  string name = 2;
  double x = 3;
  double y = 4;
  double speed = 5;
  double altitude = 6;
  double angle = 7;
  repeated string visible_peers = 8;
  int32 port_quantity = 9;
  int32 port_generation = 10;
}